<!--
  Representative fixture: a Salesforce Commerce Cloud-style search results
  page (the kind of markup hugoboss.com and similar DTC fashion sites
  typically use - a "-p<id>" or numeric-id "*.html" product URL pattern under
  a results grid). Hand-built for this test suite; NOT captured from the
  live site (this sandbox has no outbound internet access).
-->
<!doctype html>
<html>
<head><title>Search Results</title></head>
<body>
  <header>
    <a href="/us/en/account/login">Sign In</a>
    <a href="/us/en/wishlist">Wishlist</a>
  </header>
  <div class="search-result-content">
    <div class="product-tile">
      <a href="/us/en/slim-fit-shirt-in-cotton-poplin-50512345.html" class="product-tile-link">
        <img src="/images/50512345_black.jpg" alt="Slim-Fit Shirt in Cotton Poplin, Black" />
      </a>
    </div>
    <div class="product-tile">
      <a href="/us/en/regular-fit-jacket-50567890.html" class="product-tile-link">
        <img src="/images/50567890_navy.jpg" alt="Regular-Fit Jacket, Navy" />
      </a>
    </div>
  </div>
  <footer>
    <a href="/us/en/customer-service">Customer Service</a>
    <a href="/us/en/store-locator">Find a Store</a>
  </footer>
</body>
</html>
